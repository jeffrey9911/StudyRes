    <style>
        /* 1. Body Styling: Center the survey on the screen */
        body {
            margin: 0;
            padding: 0;
            background-color: #f0f0f0; /* Light gray background to see the survey boundaries */
            min-height: 100vh;
            display: flex;
            justify-content: center; /* Horizontally center */

            overflow: auto;          /* Allow scrolling if screen is smaller than 824x998 */

        #survey-container {
            width: 824px;   /* <--- Fixed Width */
            height: 998px;  /* <--- Fixed Height */
            background-color: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); /* Optional: Adds a shadow for looks */
        }
    </style>
